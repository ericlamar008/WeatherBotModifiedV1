# مسیر واقعی: .github/workflows/heartbeat_dashboard_link.yml
#
# PATCH (این نسخه): اضافه‌شدن بند concurrency که در سه Workflow نوشتاری
# دیگر (monitor_locks.yml، scan_daily.yml، process_lock_events.yml) از قبل
# وجود داشت اما در این فایل هرگز اضافه نشده بود. نبود آن باعث می‌شد اگر
# این Workflow دقیقاً هم‌زمان با یکی از آن سه اجرا شود (مثلاً هر دو با
# فاصلهٔ چند ثانیه از cron-job.org یا تست دستی)، هر دو هم‌زمان روی
# simple.html / docs/simple.html بنویسند و در rebase به‌هم بخورند --
# دقیقاً همان CONFLICT و اجراهای طولانی/ناموفقی که مشاهده شد.

# PATCH (رفع CONFLICT مکرر در push -- لاگ واقعی: __pycache__/*.pyc و
# data/markets/*.json و simple.html در rebase conflict می‌شدند و ۴ تلاش بعدی
# هم به‌خاطر باقی‌ماندن rebase نیمه‌کاره با «unmerged files» شکست می‌خوردند):
#  1) PYTHONDONTWRITEBYTECODE=1 تا هیچ .pyc ای ساخته نشود، و __pycache__ از
#     ایندکس حذف و از git add کنار گذاشته می‌شود.
#  2) بعد از هر rebase ناموفق، حتماً git rebase --abort زده می‌شود.
#  3) اگر rebase نشد، به‌جای rebase دوباره: fetch + reset --hard روی آخرین
#     نسخهٔ ریموت و فقط بازسازی سریع داشبورد (نتیجهٔ همین اجرای lite_scan در
#     این حالت نادر دور ریخته می‌شود و در اجرای بعدی دوباره تازه می‌شود).
#  4) سیاست نگه‌داری نسخه‌های docs با monitor_locks.yml یکی شد (۶۰ فایل) و
#     مرتب‌سازی بر اساس شمارهٔ run انجام می‌شود، نه زمان فایل (بعد از checkout
#     زمان همهٔ فایل‌ها تقریباً یکی است).
#  5) docs/.nojekyll برای سبک‌تر شدن build در GitHub Pages، و cache برای pip.
# بقیهٔ منطق (اسکن سبک، انتشار نسخهٔ یکتا، ارسال لینک در تلگرام) تغییری نکرده.

name: WeatherBet - بروزرسانی و یادآوری ۶ساعتهٔ داشبورد تعاملی

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weatherbot-data-writer
  cancel-in-progress: false

env:
  # جلوگیری از ساخت __pycache__/*.pyc (فایل باینری که هر اجرا فرق می‌کند و
  # در rebase/merge همیشه CONFLICT غیرقابل‌حل می‌سازد)
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: نصب پیش‌نیازها
        run: pip install -r requirements.txt

      - name: اجرای اسکن سبک (تازه‌سازی قیمت/پیش‌بینی، بدون سایزینگ)
        run: python weatherbot_v3.py lite_scan

      - name: ساخت دوبارهٔ داشبورد تعاملی با آخرین داده‌های موجود
        run: python dashboard_simple.py

      - name: انتشار نسخهٔ یکتای داشبورد و پاک‌سازی نسخه‌های قدیمی
        run: |
          mkdir -p docs
          DASHBOARD_FILE="simple-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.html"
          cp simple.html "docs/${DASHBOARD_FILE}"
          # مسیر ثابت فقط برای bookmarkهای قدیمی باقی می‌ماند؛ لینک تلگرام
          # به نسخهٔ یکتا اشاره می‌کند تا کش نتواند خروجی قبلی را برگرداند.
          cp simple.html docs/simple.html
          cp data/lock_history.csv docs/lock_history.csv || echo "هنوز CSV ای وجود ندارد"
          echo "DASHBOARD_FILE=${DASHBOARD_FILE}" >> "$GITHUB_ENV"

          touch docs/.nojekyll

          # فقط فایل‌های نسخه‌ای simple-*.html را بر اساس شمارهٔ run مرتب کن و
          # ۶۰ فایل تازه را نگه‌دار (هم‌سیاست با monitor_locks.yml). این دستور
          # هرگز docs/simple.html، dashboard.html، CSV یا فایل‌های data/ را
          # حذف نمی‌کند.
          mapfile -t OLD_DASHBOARDS < <(ls -1 docs/simple-*.html 2>/dev/null | sort -t- -k2,2nr -k3,3nr -k4,4nr | tail -n +61 || true)
          if [ "${#OLD_DASHBOARDS[@]}" -gt 0 ]; then
            printf 'حذف نسخه‌های قدیمی داشبورد:\n%s\n' "${OLD_DASHBOARDS[@]}"
            rm -- "${OLD_DASHBOARDS[@]}"
          fi

      - name: کامیت و انتشار (با ایمنی در برابر برخورد هم‌زمان)
        run: |
          git config user.name "weatherbot-ci"
          git config user.email "ci@users.noreply.github.com"
          REF="${{ github.ref_name }}"

          stage_all() {
            # __pycache__ اگر هنوز در ریپو ردیابی می‌شود، از ایندکس خارج شود و
            # هرگز دوباره اضافه نشود.
            git rm -r -q --cached __pycache__ 2>/dev/null || true
            git add -A -- . ':(exclude)__pycache__' ':(exclude)*.pyc'
          }

          republish_docs() {
            mkdir -p docs
            cp simple.html "docs/${DASHBOARD_FILE}"
            cp simple.html docs/simple.html
            cp data/lock_history.csv docs/lock_history.csv || echo "هنوز CSV ای وجود ندارد"
            touch docs/.nojekyll
            mapfile -t OLD_DASHBOARDS < <(ls -1 docs/simple-*.html 2>/dev/null | sort -t- -k2,2nr -k3,3nr -k4,4nr | tail -n +61 || true)
            if [ "${#OLD_DASHBOARDS[@]}" -gt 0 ]; then
              rm -- "${OLD_DASHBOARDS[@]}"
            fi
          }

          stage_all
          git commit -m "اسکن سبک ۶ساعته + بروزرسانی داشبورد تعاملی" || echo "چیزی برای کامیت نبود"

          PUSHED=false
          for i in 1 2 3 4 5; do
            if [ "$i" -eq 1 ]; then
              if git pull --rebase origin "$REF" && git push; then
                PUSHED=true
                break
              fi
              echo "تلاش 1 ناموفق بود -- لغو rebase نیمه‌کاره و رفتن به حالت بازسازی از آخرین نسخهٔ ریموت..."
              git rebase --abort 2>/dev/null || true
            else
              echo "=== تلاش $i: بازسازی داشبورد روی آخرین نسخهٔ ریموت ==="
              git rebase --abort 2>/dev/null || true
              git fetch origin
              git reset --hard "origin/${REF}"
              python dashboard_simple.py
              republish_docs
              stage_all
              if git diff --cached --quiet; then
                echo "چیزی برای کامیت نبود -- اجرای دیگری قبلاً همین وضعیت را منتشر کرده."
                PUSHED=true
                break
              fi
              git commit -m "اسکن سبک ۶ساعته + بروزرسانی داشبورد تعاملی (بازسازی)"
              if git push; then
                PUSHED=true
                break
              fi
            fi
            echo "تلاش $i برای push ناموفق بود -- ۵ ثانیه صبر و تلاش دوباره..."
            sleep 5
          done

          if [ "$PUSHED" != "true" ]; then
            echo "::error::انتشار تغییرات بعد از ۵ تلاش ناموفق بود."
            exit 1
          fi

      - name: ارسال لینک نسخه‌ای داشبورد در تلگرام
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_FILE: ${{ env.DASHBOARD_FILE }}
        run: |
          python3 - <<'PY'
          import os, requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat = os.environ.get("TELEGRAM_CHAT_ID", "")
          dashboard_file = os.environ["DASHBOARD_FILE"]
          link = f"https://ericlamar008.github.io/weatherbot/{dashboard_file}"
          text = f"\U0001F504 بروزرسانی ۶ساعته -- داشبورد تعاملی تازه‌سازی شد:\n{link}"
          if token and chat:
              requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={"chat_id": chat, "text": text},
                  timeout=15,
              )
          else:
              print("توکن یا چت آیدی تلگرام تنظیم نشده:", text)
          PY
