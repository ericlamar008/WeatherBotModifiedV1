<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>در حال انتقال به آخرین نسخه داشبورد... | WeatherBot</title>
  <script>
    (function () {
      try {
        var path = window.location.pathname || "";
        var ts = Date.now();
        var baseDir = path.substring(0, path.lastIndexOf("/") + 1) || "/";
        var targetFile = path.indexOf("strategy-lab") !== -1 ? "strategy-lab.html" : "simple.html";
        var targetUrl = window.location.origin + baseDir + targetFile + "?_r=" + ts;
        window.location.replace(targetUrl);
      } catch (e) {
        window.location.href = "simple.html?_r=" + Date.now();
      }
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.45);
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 17px; margin: 0 0 8px; color: #38bdf8; }
    p { font-size: 13px; color: #94a3b8; line-height: 1.7; margin: 0 0 18px; }
    a.btn {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>در حال بارگذاری آخرین نسخهٔ داشبورد...</h1>
    <p>نسخهٔ اختصاصی این اسکن در حال همگام‌سازی روی CDN گیت‌هاب است. به صورت خودکار به نسخهٔ اصلی و به‌روز هدایت می‌شوید.</p>
    <a id="fallback-link" class="btn" href="simple.html">ورود مستقیم به داشبورد</a>
  </div>
  <script>
    var fl = document.getElementById("fallback-link");
    if (fl) {
      var isLab = (window.location.pathname || "").indexOf("strategy-lab") !== -1;
      fl.href = (isLab ? "strategy-lab.html" : "simple.html") + "?_r=" + Date.now();
    }
  </script>
</body>
</html>
